name: Build & Publish PostgreSQL 16 Container

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
    paths:
      - 'containers/postgres/**'
      - 'packages/db/src/schema.sql'
      - 'packages/db/src/seed.sql'
      - '.github/workflows/build-postgres.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/postgres

jobs:
  build-and-push:
    name: Build & Push PostgreSQL Multi-Arch Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=0.5.0
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=BradTech PostgreSQL 16 MDM Database
            org.opencontainers.image.description=PostgreSQL 16 container with automated MDM schema & seed provisioning
            org.opencontainers.image.vendor=Brad Technology
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containers/postgres/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
