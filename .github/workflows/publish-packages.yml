name: Publish NPM Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'NPM dist-tag (e.g. latest, beta, next, v0.5.0)'
        required: true
        default: 'latest'

jobs:
  publish:
    name: Publish Packages to NPM & GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          scope: '@bradtech'

      - name: Install dependencies & build
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test

      - name: Publish packages to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.dist_tag || 'latest' }}"
          echo "Publishing packages with dist-tag: $TAG"
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/package.json" ]; then
              # Check if private
              IS_PRIVATE=$(node -p "require('./$pkg/package.json').private || false")
              if [ "$IS_PRIVATE" != "true" ]; then
                echo "🚀 Publishing $pkg..."
                npm publish --workspace="$pkg" --access public --tag "$TAG" --provenance || echo "⚠️ Warning: failed publishing $pkg"
              fi
            fi
          done
